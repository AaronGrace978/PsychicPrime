name: Release Linux

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Install frontend deps
        run: npm ci

      - name: Build Linux bundles
        run: npm run desktop:build -- --bundles deb,appimage

      - name: Patch AppImage for SteamOS / AMD GPUs
        run: |
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2
          chmod +x scripts/patch-appimage-steamos.sh
          ./scripts/patch-appimage-steamos.sh src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Collect artifacts
        run: |
          mkdir -p release
          cp src-tauri/target/release/bundle/deb/*.deb release/ || true
          cp src-tauri/target/release/bundle/appimage/*.AppImage release/ || true
          cp docs/install-steamdeck.sh release/
          cd release && sha256sum * > SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: psychicprime-linux
          path: release/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: false
